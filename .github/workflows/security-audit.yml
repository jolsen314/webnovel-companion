name: Security audit

# Three triggers, covering every way the advisory picture changes:
#   - pull_request:      advisories you *introduce* via a PR (earliest gate).
#   - push (main):       advisories you introduce by committing straight to
#                        main without a PR — audited immediately, not next week.
#   - schedule (weekly): advisories newly *published* against deps you already
#                        have (npm audit queries the registry live).
# Kept separate from ci.yml so the weekly cron stays fast — no Postgres,
# no Playwright, no build. `npm audit` reads package-lock.json directly.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fails the job (red check = the alert) when a high/critical advisory is
      # present, EXCEPT ids justified in .github/audit-allowlist.txt. Same
      # script the local dependency hook uses, so CI and dev agree. Non-blocking
      # by intent: leave this check un-required so it informs without gating.
      - name: npm audit (high+, allowlist-aware)
        run: |
          bash scripts/check-advisories.sh && echo "No unaccepted high/critical advisories."
