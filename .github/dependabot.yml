# Dependabot: keep dependencies patched and alert on new advisories against
# packages we already have. Security updates (from the advisory database) are
# raised automatically when GitHub "Dependabot alerts" are enabled for the repo
# (Settings → Advanced Security → Dependabot). This file adds scheduled version
# updates on top of those.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Two grouped PRs at most: routine minor/patch, and a separate majors PR.
    # Majors are kept (not ignored) so their changelogs + CI stay visible for
    # review; grouping keeps them to one PR instead of one-per-dependency.
    # Security fixes are independent of this and unaffected by grouping.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major-updates:
        update-types:
          - major
    # Prisma 7 is a real migration (schema `url` → prisma.config.ts + driver
    # adapters), not a drop-in bump — do it deliberately, not via Dependabot.
    # Keep prisma + @prisma/client in lockstep and pinned to 6.x here; this
    # ignore applies to version updates only (security updates are unaffected).
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
