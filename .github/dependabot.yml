# Dependabot: keep dependencies patched and alert on new advisories against
# packages we already have. Security updates (from the advisory database) are
# raised automatically when GitHub "Dependabot alerts" are enabled for the repo
# (Settings → Advanced Security → Dependabot). This file adds scheduled version
# updates on top of those.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Two grouped PRs at most: routine minor/patch, and a separate majors PR.
    # Majors are kept (not ignored) so their changelogs + CI stay visible for
    # review; grouping keeps them to one PR instead of one-per-dependency.
    # Security fixes are independent of this and unaffected by grouping.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major-updates:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
